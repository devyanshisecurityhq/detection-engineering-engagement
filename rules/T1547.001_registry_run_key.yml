title: Suspicious Registry Run Key Modification
id: 1c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
status: experimental
description: Detects modification of registry Run keys used for persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Devyanshi (devyanshisecurityhq)
date: 2026/10/05
tags:
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
            - '\Software\Microsoft\Windows\CurrentVersion\RunServices'
    selection_suspicious:
        Details|contains:
            - 'powershell'
            - 'cmd.exe'
            - 'rundll32'
            - 'mshta'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\ProgramData\'
            - 'http://'
            - 'https://'
    condition: selection_key and selection_suspicious
falsepositives:
    - Legitimate software auto-start entries
    - Software updates
    - User-installed applications
level: high
