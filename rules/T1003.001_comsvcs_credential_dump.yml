title: Credential Dumping via comsvcs.dll MiniDump
id: 4d3c2b1a-5e6f-7a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: Detects credential dumping using rundll32.exe with comsvcs.dll MiniDump export to dump LSASS memory
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Devyanshi (devyanshisecurityhq)
date: 2026/10/05
tags:
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_dump:
        CommandLine|contains:
            - 'comsvcs.dll'
            - 'MiniDump'
            - '#24'
            - '#-1'
    condition: selection_img and selection_dump
falsepositives:
    - Legitimate debugging tools
    - Memory analysis during incident response
    - Software diagnostics
level: critical
