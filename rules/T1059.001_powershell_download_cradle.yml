title: PowerShell Download Cradle
id: 2d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f8a
status: experimental
description: Detects PowerShell download cradle patterns commonly used to fetch and execute remote payloads
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Devyanshi (devyanshisecurityhq)
date: 2026/10/05
tags:
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cradle:
        CommandLine|contains:
            - 'DownloadString'
            - 'DownloadFile'
            - 'DownloadData'
            - 'Invoke-WebRequest'
            - 'IWR '
            - 'curl '
            - 'wget '
            - 'Net.WebClient'
            - 'Start-BitsTransfer'
            - 'Invoke-RestMethod'
    condition: selection_img and selection_cradle
falsepositives:
    - Legitimate administrative scripts
    - Software deployment tools
    - Package managers
level: high
