title: Credential Dumping via ProcDump
id: 3e5f6a7b-8c9d-0e1f-2a3b-4c5d6e7f8a9b
status: experimental
description: Detects credential dumping using ProcDump to dump LSASS memory
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Devyanshi (devyanshisecurityhq)
date: 2026/10/05
tags:
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
    selection_args:
        CommandLine|contains:
            - 'lsass'
            - '-ma'
            - '-mm'
            - 'accepteula'
    condition: selection_img and selection_args
falsepositives:
    - Legitimate debugging during incident response
    - Software diagnostics by administrators
level: critical
