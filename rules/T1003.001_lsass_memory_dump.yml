title: LSASS Memory Dump via Suspicious Process
id: 9b4e3d2f-5c6a-7b8e-9d0f-1a2b3c4d5e6f
status: experimental
description: Detects processes accessing LSASS memory, a common credential dumping technique used by Mimikatz and similar tools
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Devyanshi (devyanshisecurityhq)
date: 2026/10/05
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1038'
            - '0x1fffff'
            - '0x1410'
            - '0x1438'
    filter_legit:
        SourceImage|endswith:
            - '\svchost.exe'
            - '\MsMpEng.exe'
            - '\csrss.exe'
            - '\lsass.exe'
            - '\services.exe'
            - '\wininit.exe'
    condition: selection and not filter_legit
falsepositives:
    - Antivirus/EDR products scanning LSASS
    - Windows Defender Credential Guard
    - Legitimate administrative tools (Process Explorer, ProcDump)
level: critical
